<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Downloader</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>YouTube Video Downloader</h1>
        <form id="download-form">
            <input type="text" id="url" name="url" placeholder="Enter YouTube video link" required>
            <div class="button-container">
                <button type="button" class="btn" id="usable-quality-btn" data-action="usable">Download in Usable Quality</button>
                <button type="button" class="btn" id="best-quality-btn" data-action="best">Download in Best Quality</button>
            </div>
        </form>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Downloading...</p>
        </div>
        <div id="message" class="message"></div>
    </div>
    <script>
        document.getElementById('usable-quality-btn').addEventListener('click', function() {
            submitForm('usable');
        });

        document.getElementById('best-quality-btn').addEventListener('click', function() {
            submitForm('best');
        });

        function submitForm(action) {
            document.getElementById('loading').style.display = 'flex';
            document.getElementById('message').style.display = 'none';

            const url = document.getElementById('url').value;
            const formData = new FormData();
            formData.append('url', url);
            formData.append('action', action);

            fetch('/download', {
                method: 'POST',
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                const messageDiv = document.getElementById('message');
                if (data.success) {
                    messageDiv.textContent = 'Download complete! Check your downloads folder.';
                } else {
                    messageDiv.textContent = `Error: ${data.error}`;
                }
                messageDiv.style.display = 'block';
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                const messageDiv = document.getElementById('message');
                messageDiv.textContent = `Error: ${error}`;
                messageDiv.style.display = 'block';
            });
        }
    </script>
</body>
</html>
